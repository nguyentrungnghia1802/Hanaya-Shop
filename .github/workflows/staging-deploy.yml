name: 🌱 Staging Deploy

# Enhanced staging deployment with validation
on:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "#GUIDE/**"

  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force staging deployment"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip pre-deployment tests"
        required: false
        default: false
        type: boolean

env:
  DOCKER_IMAGE: assassincreed2k1/hanaya-shop

jobs:
  # 🔍 Pre-deployment validation
  validation:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if deployment needed
        id: check
        run: |
          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 Force deployment enabled"
          else
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deploying changes to staging"
          fi

  # 🧪 Quick tests before staging
  quick-tests:
    name: 🧪 Quick Validation Tests
    runs-on: ubuntu-latest
    needs: validation
    if: needs.validation.outputs.should-deploy == 'true' && github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Run syntax check
        run: |
          echo "🔍 Running PHP syntax check..."
          find app -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"
          echo "✅ Syntax check passed"

  # 🌱 Staging Deployment
  staging-deploy:
    runs-on: ubuntu-latest
    name: 🌱 Deploy to Staging Environment
    needs: [validation, quick-tests]
    if: |
      always() && 
      needs.validation.outputs.should-deploy == 'true' &&
      (needs.quick-tests.result == 'success' || needs.quick-tests.result == 'skipped')
    environment:
      name: staging
      url: http://staging.hanayashop.com

    steps:
      - name: Staging Deployment Info
        run: |
          echo "🌱 Starting Staging Deployment!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Purpose: Pre-production testing and validation"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:staging
            ${{ env.DOCKER_IMAGE }}:staging-${{ github.sha }}
          labels: |
            git_sha=${{ github.sha }}
            build_date=${{ github.event.head_commit.timestamp }}
            version=staging
            environment=staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Image security scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:staging
          format: "table"
          severity: "HIGH,CRITICAL"

      - name: Deploy to Staging Server
        if: vars.STAGING_SERVER_ENABLED == 'true'
        run: |
          echo "🚀 Deploying to staging server..."
          # Add your staging deployment commands here
          echo "✅ Staging deployment completed"

      - name: Staging Summary
        run: |
          echo "## 🌱 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Image | \`${{ env.DOCKER_IMAGE }}:staging-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Test staging application thoroughly" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Verify all features work correctly" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Run integration tests" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ When ready, merge to main for production" >> $GITHUB_STEP_SUMMARY
